name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test with synthetic sessions
        run: python -B -m unittest discover -s tests -v
      - name: Install and check the CLI
        run: |
          python -m pip install --no-deps .
          session-doctor --version
          (cd "$RUNNER_TEMP" && python -c 'from native_verifier import HARNESS; assert HARNESS.is_file()')

  native:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build pinned verifier
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        run: |
          export SESSION_DOCTOR_REAL_CARGO="$(command -v cargo)"
          test -x "$SESSION_DOCTOR_REAL_CARGO"
          export SESSION_DOCTOR_CARGO_LOG="$RUNNER_TEMP/session-doctor-cargo.log"
          shim="$RUNNER_TEMP/session-doctor-cargo-bin"
          mkdir -p "$shim"
          cat > "$shim/cargo" <<'SH'
          #!/bin/sh
          exec "$SESSION_DOCTOR_REAL_CARGO" "$@" 2>>"$SESSION_DOCTOR_CARGO_LOG"
          SH
          chmod +x "$shim/cargo"
          if ! PATH="$shim:$PATH" ./session-doctor validator-build; then
            if [ -f "$SESSION_DOCTOR_CARGO_LOG" ]; then
              tail -n 100 "$SESSION_DOCTOR_CARGO_LOG"
            fi
            df -h "$RUNNER_TEMP"
            exit 1
          fi
      - name: Require native reconstruction tests
        run: |
          verifier=$(python -B -c 'from types import SimpleNamespace; from native_verifier import find_verifier; print(find_verifier(SimpleNamespace(), required=True))')
          export SESSION_DOCTOR_NATIVE_TEST_BIN="$verifier"
          python -B -m unittest discover -s tests -v
          npm test

  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Pack, install offline and test the launcher
        run: npm test
