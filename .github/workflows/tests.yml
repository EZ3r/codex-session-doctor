name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test with synthetic sessions
        run: python -B -m unittest discover -s tests -v
      - name: Install and check the CLI
        run: |
          python -m pip install --no-deps .
          session-doctor --version
          (cd "$RUNNER_TEMP" && python -c 'from native_verifier import HARNESS; assert HARNESS.is_file()')

  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Build pinned verifier
        run: ./session-doctor validator-build
      - name: Require native reconstruction tests
        run: |
          python -B -c 'from types import SimpleNamespace; from native_verifier import find_verifier; find_verifier(SimpleNamespace(), required=True)'
          python -B -m unittest discover -s tests -v
